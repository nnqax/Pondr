<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pondr Schedule — Calendar & Duckley Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F4F7F9;
      --panel-bg: #FFFFFF;
      --sidebar-active: #FEF9C3;
      --accent-yellow: #FFF176;
      --bot-blue: #B9E0F5;
      --ink-dark: #274156;
      --ink-muted: #7E94A4;
      --line-color: #E6EEF2;
      --completed-color: #B3C8D6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--ink-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 1180px;
      height: 650px;
      background: var(--panel-bg);
      border-radius: 24px;
      display: grid;
      grid-template-columns: 210px 1fr 300px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(39, 65, 86, 0.08);
      border: 1px solid var(--line-color);
    }

    /* LEFT SIDEBAR (shared with chat page) */
    .sidebar {
      background: #FAFCFD;
      border-right: 1px solid var(--line-color);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      color: var(--ink-dark);
      padding-left: 6px;
    }

    .duck-badge {
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .nav-item.active {
      background: var(--sidebar-active);
      color: var(--ink-dark);
    }

    .nav-item:hover:not(.active) {
      background: #F0F4F7;
    }

    .sidebar-heading {
      font-size: 11px;
      font-weight: 700;
      color: #A0B2C0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 12px;
      margin-top: 8px;
    }

    /* CENTER CALENDAR PANEL */
    .calendar-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--panel-bg);
    }

    .calendar-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-dark);
      min-width: 160px;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .calendar-nav button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line-color);
      background: #FAFCFD;
      font-size: 13px;
      cursor: pointer;
      color: var(--ink-dark);
    }

    .calendar-nav button:hover { background: #F0F4F7; }

    .today-btn {
      border: 1px solid var(--line-color);
      background: #FAFCFD;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink-dark);
      margin-left: 6px;
    }

    .today-btn:hover { background: #F0F4F7; }

    .calendar-body {
      flex: 1;
      padding: 16px 22px 22px;
      overflow-y: auto;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .weekday-row span {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 74px;
      gap: 6px;
    }

    .day-cell {
      border: 1px solid var(--line-color);
      border-radius: 12px;
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.15s ease;
      background: #fff;
    }

    .day-cell:hover { background: #FAFCFD; border-color: #D6E2E9; }

    .day-cell.outside {
      opacity: 0.35;
    }

    .day-cell.today {
      border-color: var(--accent-yellow);
      box-shadow: inset 0 0 0 2px var(--accent-yellow);
    }

    .day-cell.selected {
      background: var(--sidebar-active);
      border-color: #F5D98A;
    }

    .day-number {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-dark);
    }

    .day-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .day-badge {
      font-size: 9px;
      font-weight: 700;
      border-radius: 6px;
      padding: 1px 5px;
    }

    .day-badge.tasks { background: #DCEEFB; color: #2E6E96; }
    .day-badge.notes { background: #FFF3D6; color: #8A6A1D; }

    /* RIGHT DAY-DETAIL PANEL */
    .detail-panel {
      background: #FAFCFD;
      border-left: 1px solid var(--line-color);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .detail-header h4 {
      font-size: 14.5px;
      font-weight: 800;
    }

    .detail-header p {
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-dark);
      margin-top: 4px;
    }

    .task-mini-list, .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-mini-card {
      background: #fff;
      border: 1px solid var(--line-color);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-mini-check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 2px solid var(--line-color);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
    }

    .task-mini-card.completed .task-mini-check {
      background: #10B981;
      border-color: #10B981;
    }

    .task-mini-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-dark);
    }

    .task-mini-card.completed .task-mini-title {
      color: var(--completed-color);
      text-decoration: line-through;
    }

    .task-mini-time {
      font-size: 10px;
      color: var(--ink-muted);
    }

    .empty-hint {
      font-size: 11.5px;
      color: var(--ink-muted);
      background: #fff;
      border: 1px dashed var(--line-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .ask-duckley-btn {
      width: 100%;
      background: var(--ink-dark);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ask-duckley-btn:hover { background: #1c3040; }
    .ask-duckley-btn:disabled { opacity: 0.6; cursor: default; }

    .note-card {
      background: #fff;
      border: 1px solid var(--line-color);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .note-card.duckley {
      background: #FFF9E6;
      border-color: #F5D98A;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .note-source {
      font-size: 10.5px;
      font-weight: 700;
      color: #8A6A1D;
    }

    .note-card:not(.duckley) .note-source {
      color: var(--ink-muted);
    }

    .note-delete {
      background: none;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 12px;
    }

    .note-delete:hover { color: #e53e3e; }

    .note-text {
      color: var(--ink-dark);
      white-space: pre-wrap;
    }

    .add-note-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .add-note-row textarea {
      resize: none;
      height: 56px;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid var(--line-color);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
    }

    .add-note-row button {
      background: #EEF3F6;
      border: 1px solid var(--line-color);
      color: var(--ink-dark);
      padding: 8px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-note-row button:hover { background: #E2E8F0; }

    /* Hamburger button that opens/closes the sidebar on mobile. Hidden on desktop. */
    .nav-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line-color);
      background: #FAFCFD;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
    }

    .nav-toggle-btn:hover { background: #F0F4F7; }

    /* Dark backdrop shown behind the open sidebar drawer on mobile */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 40, 0.4);
      z-index: 998;
    }

    .sidebar-overlay.show { display: block; }

    /* ===== MOBILE RESPONSIVE (does not affect desktop layout above) ===== */
    @media (max-width: 860px) {
      body {
        align-items: flex-start;
        padding: 0;
      }

      /* Stack calendar / day-detail panel vertically; sidebar becomes an off-canvas drawer */
      .app-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        width: 100%;
        max-width: 100%;
        height: auto;
        min-height: 100vh;
        border-radius: 0;
        border: none;
        overflow: visible;
      }

      .nav-toggle-btn { display: flex; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 230px;
        max-width: 78vw;
        z-index: 999;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 6px 0 24px rgba(20, 30, 40, 0.18);
        border-right: none;
        padding: 16px;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .calendar-panel {
        height: auto;
        overflow: visible;
      }

      .calendar-header {
        flex-wrap: wrap;
        row-gap: 10px;
      }

      .day-grid {
        grid-auto-rows: 56px;
      }

      .detail-panel {
        border-left: none;
        border-top: 1px solid var(--line-color);
        max-height: 60vh;
      }
    }

    @media (max-width: 480px) {
      .day-grid { grid-auto-rows: 46px; gap: 4px; }
      .weekday-row { gap: 4px; }
      .day-cell { padding: 4px 5px; }
      .day-badge { font-size: 8px; padding: 1px 3px; }
      .calendar-title { font-size: 14px; min-width: 0; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Backdrop shown behind the sidebar drawer on mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="brand-logo"><div class="duck-badge">🦆</div>Pondr</div>
      <ul class="nav-list">
        <a href="index.html" class="nav-item"><span>⬅️</span> Back to home</a>
        <a href="chat.html" class="nav-item"><span>💬</span> Chat with Duckley</a>
        <li class="nav-item active"><span>📅</span> Schedule</li>
      </ul>
    </div>

    <!-- CENTER CALENDAR -->
    <div class="calendar-panel">
      <div class="calendar-header">
        <button class="nav-toggle-btn" id="navToggleBtn" aria-label="Open menu">☰</button>
        <div class="calendar-title" id="calendarTitle">July 2026</div>
        <div class="calendar-nav">
          <button id="prevMonthBtn" title="Previous month">‹</button>
          <button id="nextMonthBtn" title="Next month">›</button>
          <button class="today-btn" id="todayBtn">Today</button>
        </div>
      </div>
      <div class="calendar-body">
        <div class="weekday-row">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="day-grid" id="dayGrid"></div>
      </div>
    </div>

    <!-- RIGHT DAY DETAIL PANEL -->
    <div class="detail-panel">
      <div class="detail-header">
        <h4 id="detailDateTitle">Today</h4>
        <p id="detailDateSub">Tasks and notes for this day</p>
      </div>

      <div class="section-title">📌 Tasks due</div>
      <div class="task-mini-list" id="taskMiniList"></div>

      <button class="ask-duckley-btn" id="askDuckleyBtn">🦆 Ask Duckley to plan this day</button>

      <div class="section-title">🗒️ Notes</div>
      <div class="add-note-row">
        <textarea id="manualNoteInput" placeholder="Jot a note for this day..."></textarea>
        <button id="addNoteBtn">Add note</button>
      </div>
      <div class="notes-list" id="notesList"></div>
    </div>

  </div>

  <script type="module">
    // Loaded on-demand (not at page load) so that a slow/unreachable AI
    // service can never block the calendar or the rest of the page from working.
    let client;
    async function getClient() {
      if (!client) {
        const { Client } = await import("https://esm.sh/@gradio/client");
        client = await Client.connect("kode-with-klossy/3.4-groupC3-capstone");
      }
      return client;
    }

    // ---------------------------------------------------------------
    // STATE & STORAGE
    // Tasks are read from the same 'pond_tasks' key the chat page writes,
    // so a task added or completed here also shows correctly in chat.html.
    // Notes are their own store, keyed by "YYYY-MM-DD".
    // ---------------------------------------------------------------

    let tasks = JSON.parse(localStorage.getItem('pond_tasks')) || [];
    let notesByDay = JSON.parse(localStorage.getItem('pond_notes')) || {};

    let viewDate = new Date();       // month currently shown in the grid
    let selectedDate = new Date();   // day currently shown in the side panel
    viewDate.setDate(1);

    // Mobile navbar open/close (drawer + backdrop; no-op / hidden on desktop widths)
    const sidebarEl = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const navToggleBtn = document.getElementById('navToggleBtn');

    function openSidebar() {
      sidebarEl.classList.add('open');
      sidebarOverlay.classList.add('show');
    }
    function closeSidebar() {
      sidebarEl.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    }
    navToggleBtn.addEventListener('click', () => {
      sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    sidebarOverlay.addEventListener('click', closeSidebar);

    const calendarTitle = document.getElementById('calendarTitle');
    const dayGrid = document.getElementById('dayGrid');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const todayBtn = document.getElementById('todayBtn');
    const detailDateTitle = document.getElementById('detailDateTitle');
    const detailDateSub = document.getElementById('detailDateSub');
    const taskMiniList = document.getElementById('taskMiniList');
    const notesList = document.getElementById('notesList');
    const askDuckleyBtn = document.getElementById('askDuckleyBtn');
    const manualNoteInput = document.getElementById('manualNoteInput');
    const addNoteBtn = document.getElementById('addNoteBtn');

    function saveTasksToStorage() {
      localStorage.setItem('pond_tasks', JSON.stringify(tasks));
    }

    function saveNotesToStorage() {
      localStorage.setItem('pond_notes', JSON.stringify(notesByDay));
    }

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
             a.getMonth() === b.getMonth() &&
             a.getDate() === b.getDate();
    }

    function tasksForDate(d) {
      const key = dateKey(d);
      return tasks.filter(t => t.dueDate && dateKey(new Date(t.dueDate)) === key);
    }

    // ---------------------------------------------------------------
    // CALENDAR RENDERING
    // ---------------------------------------------------------------

    function renderCalendar() {
      const monthLabel = viewDate.toLocaleDateString([], { month: 'long', year: 'numeric' });
      calendarTitle.textContent = monthLabel;

      const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
      const startOffset = firstOfMonth.getDay(); // 0 = Sunday
      const gridStart = new Date(firstOfMonth);
      gridStart.setDate(firstOfMonth.getDate() - startOffset);

      const today = new Date();
      dayGrid.innerHTML = '';

      for (let i = 0; i < 42; i++) {
        const cellDate = new Date(gridStart);
        cellDate.setDate(gridStart.getDate() + i);

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (cellDate.getMonth() !== viewDate.getMonth()) cell.classList.add('outside');
        if (isSameDay(cellDate, today)) cell.classList.add('today');
        if (isSameDay(cellDate, selectedDate)) cell.classList.add('selected');

        const dayTasks = tasksForDate(cellDate);
        const dayNotes = notesByDay[dateKey(cellDate)] || [];

        cell.innerHTML = `
          <div class="day-number">${cellDate.getDate()}</div>
          <div class="day-badges">
            ${dayTasks.length ? `<span class="day-badge tasks">${dayTasks.length} task${dayTasks.length === 1 ? '' : 's'}</span>` : ''}
            ${dayNotes.length ? `<span class="day-badge notes">${dayNotes.length} note${dayNotes.length === 1 ? '' : 's'}</span>` : ''}
          </div>
        `;

        cell.addEventListener('click', () => {
          selectedDate = cellDate;
          if (cellDate.getMonth() !== viewDate.getMonth()) {
            viewDate = new Date(cellDate.getFullYear(), cellDate.getMonth(), 1);
            renderCalendar();
          } else {
            renderCalendar();
          }
          renderDetailPanel();
        });

        dayGrid.appendChild(cell);
      }
    }

    prevMonthBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      const now = new Date();
      viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
      selectedDate = now;
      renderCalendar();
      renderDetailPanel();
    });

    // ---------------------------------------------------------------
    // DAY DETAIL PANEL
    // ---------------------------------------------------------------

    function renderDetailPanel() {
      const today = new Date();
      const isToday = isSameDay(selectedDate, today);
      detailDateTitle.textContent = isToday
        ? 'Today'
        : selectedDate.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      detailDateSub.textContent = selectedDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

      // Tasks
      const dayTasks = tasksForDate(selectedDate);
      taskMiniList.innerHTML = '';
      if (dayTasks.length === 0) {
        taskMiniList.innerHTML = `<div class="empty-hint">No tasks due this day yet.</div>`;
      } else {
        dayTasks.forEach(task => {
          const card = document.createElement('div');
          card.className = `task-mini-card ${task.completed ? 'completed' : ''}`;
          card.innerHTML = `
            <div class="task-mini-check">${task.completed ? '✓' : ''}</div>
            <div style="flex:1;">
              <div class="task-mini-title">${task.title}</div>
              <div class="task-mini-time">⏰ ${task.time}</div>
            </div>
          `;
          card.querySelector('.task-mini-check').onclick = () => {
            task.completed = !task.completed;
            saveTasksToStorage();
            renderDetailPanel();
            renderCalendar();
          };
          taskMiniList.appendChild(card);
        });
      }

      // Notes
      const dayNotes = notesByDay[dateKey(selectedDate)] || [];
      notesList.innerHTML = '';
      if (dayNotes.length === 0) {
        notesList.innerHTML = `<div class="empty-hint">No notes yet for this day.</div>`;
      } else {
        dayNotes.slice().reverse().forEach(note => {
          const card = document.createElement('div');
          card.className = `note-card ${note.source === 'duckley' ? 'duckley' : ''}`;
          const timeLabel = new Date(note.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          card.innerHTML = `
            <div class="note-meta">
              <span class="note-source">${note.source === 'duckley' ? '🦆 Duckley\u2019s plan' : '📝 Your note'} · ${timeLabel}</span>
              <button class="note-delete" title="Delete note">✕</button>
            </div>
            <div class="note-text">${note.text}</div>
          `;
          card.querySelector('.note-delete').onclick = () => {
            notesByDay[dateKey(selectedDate)] = (notesByDay[dateKey(selectedDate)] || []).filter(n => n.id !== note.id);
            saveNotesToStorage();
            renderDetailPanel();
            renderCalendar();
          };
          notesList.appendChild(card);
        });
      }
    }

    function addNote(text, source) {
      if (!text || !text.trim()) return;
      const key = dateKey(selectedDate);
      if (!notesByDay[key]) notesByDay[key] = [];
      notesByDay[key].push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        text: text.trim(),
        source,
        timestamp: Date.now()
      });
      saveNotesToStorage();
      renderDetailPanel();
      renderCalendar();
    }

    addNoteBtn.addEventListener('click', () => {
      addNote(manualNoteInput.value, 'user');
      manualNoteInput.value = '';
    });

    // ---------------------------------------------------------------
    // ASK DUCKLEY FOR A DAY PLAN
    // Sends the day's tasks to the same chatbot used on the chat page,
    // and drops the reply straight into that day's notes.
    // ---------------------------------------------------------------

    askDuckleyBtn.addEventListener('click', async () => {
      const dayTasks = tasksForDate(selectedDate);
      const dayLabel = selectedDate.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

      const taskLines = dayTasks.length
        ? dayTasks.map(t => `- "${t.title}" at ${t.time}`).join('\n')
        : 'No tasks have been logged for this day yet — suggest a gentle, general pacing plan instead.';

      const prompt = `As Duckley, write a short, warm daily schedule/plan for ${dayLabel} based on these tasks:\n${taskLines}\n\nKeep it to 4-8 sentences, written in your playful pond/duck-themed voice, mentioning pacing and at least one break. Do not use a TASKS_JSON block here — just write the plan as plain text.`;

      askDuckleyBtn.disabled = true;
      askDuckleyBtn.textContent = '🦆 Thinking of a plan...';

      try {
        const activeClient = await getClient();
        const result = await activeClient.predict("/respond", { message: prompt });
        let reply = result.data;
        if (Array.isArray(reply)) reply = reply[0];
        addNote(reply, 'duckley');
      } catch (err) {
        console.error(err);
        addNote("Duckley couldn't reach the pond right now — try asking again in a moment.", 'duckley');
      }

      askDuckleyBtn.disabled = false;
      askDuckleyBtn.textContent = '🦆 Ask Duckley to plan this day';
    });

    // Keep in sync if tasks change in another tab (e.g. chat.html open alongside)
    window.addEventListener('storage', (e) => {
      if (e.key === 'pond_tasks') {
        tasks = JSON.parse(localStorage.getItem('pond_tasks')) || [];
        renderCalendar();
        renderDetailPanel();
      }
      if (e.key === 'pond_notes') {
        notesByDay = JSON.parse(localStorage.getItem('pond_notes')) || {};
        renderCalendar();
        renderDetailPanel();
      }
    });

    renderCalendar();
    renderDetailPanel();
  </script>
</body>
</html>
